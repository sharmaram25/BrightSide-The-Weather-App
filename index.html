<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1530" />
    <meta name="description" content="BrightSide — a beautiful, living weather forecast." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BrightSide" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..700&display=swap" rel="stylesheet" />

    <title>BrightSide</title>
    <style>
      /* Splash shown until React mounts */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 80% at 70% 10%, #24346b 0%, #0b1530 55%, #070b18 100%);
        transition: opacity 0.5s ease;
        z-index: 100;
      }
      #splash .orb {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff4c2, #fbbf24 45%, #f97316 100%);
        box-shadow: 0 0 60px 10px rgba(251, 191, 36, 0.35);
        animation: breathe 2.4s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.08);
          box-shadow: 0 0 80px 18px rgba(251, 191, 36, 0.45);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash"><div class="orb"></div></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
